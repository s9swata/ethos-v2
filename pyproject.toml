[project]
name = "ethos-api"
version = "1.0.0"
description = "Music streaming API powered by yt-dlp and ytmusicapi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "slowapi>=0.1.9",
    "yt-dlp>=2026",
    "ytmusicapi>=1.12",
]
