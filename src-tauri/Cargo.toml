[package]
name = "ethos-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethos_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yt-dlp = { git = "https://github.com/Guilherme-j10/yt-dlp.git", rev = "acfed532621e9b585497d18c13df7b70dc2956dd", features = ["cache-redb"] }
tokio = { version = "1", features = ["sync"] }
