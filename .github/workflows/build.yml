name: Build & Test

on:
  push:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install JS deps
        run: bun install

      - name: Svelte check
        run: bunx svelte-check --tsconfig ./tsconfig.json

      - name: Build frontend
        run: bun run build

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: bun install

      - name: Build sidecar server
        run: |
          pip install pyinstaller
          bash server/sidecar/build.sh
        shell: bash

      - name: Generate icons
        run: bun run tauri icon src-tauri/ethos-cat.png

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          APPLE_CERTIFICATE: ""
          APPLE_CERTIFICATE_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ""
          APPLE_ID: ""
          APPLE_PASSWORD: ""
          APPLE_TEAM_ID: ""

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ethos-macos
          path: src-tauri/target/release/bundle/macos/Ethos.app
          if-no-files-found: warn

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ethos-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: bun install

      - name: Build sidecar server
        run: |
          pip install pyinstaller
          bash server/sidecar/build.sh
        shell: bash

      - name: Generate icons
        run: bun run tauri icon src-tauri/ethos-cat.png

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: ethos-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: ethos-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install JS deps
        run: bun install

      - name: Build sidecar server
        run: |
          pip install pyinstaller
          bash server/sidecar/build.sh
        shell: bash

      - name: Generate icons
        run: bun run tauri icon src-tauri/ethos-cat.png

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ethos-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ethos-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
