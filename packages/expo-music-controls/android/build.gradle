apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.music.controls'
version = '0.1.0'

android {
  namespace "expo.music.controls"
  compileSdk 34

  defaultConfig {
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlinVersion()}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
  implementation "androidx.media:media:1.7.0"
  implementation "androidx.core:core:1.12.0"
  implementation "androidx.media:media-widget:1.0.0"
}

fun kotlinVersion(): String {
  return rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion") as String
    : "1.9.22"
}
